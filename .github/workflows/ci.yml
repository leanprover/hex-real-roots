name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - name: Install oracle dependencies
        run: python3 -m pip install --user python-flint
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: Build library and release regressions
        run: lake build HexRealRoots HexRealRootsTests
      - name: Build conformance sidecar
        run: |
          cd conformance
          lake build
      - name: Conformance oracle
        run: |
          (cd conformance && lake exe hexrealroots_emit_fixtures) > /tmp/hexrealroots-fresh.jsonl
          diff -u conformance-fixtures/HexRealRoots/realroots.jsonl /tmp/hexrealroots-fresh.jsonl
          python3 scripts/oracle/realroots_flint.py < /tmp/hexrealroots-fresh.jsonl
      - name: Build and verify benchmarks
        env:
          BENCH_VERIFY_HARD_CAP_SECONDS: "360"
        run: |
          cd bench
          lake build hexrealroots_bench
          bash ../scripts/ci/check_bench_verify_budget.sh hexrealroots_bench
      - name: Assert Mathlib-free
        run: |
          if find .lake bench/.lake conformance/.lake -type d -name Mathlib 2>/dev/null | grep -q .; then
            echo "ERROR: a Lake build pulled in Mathlib"; exit 1; fi
          if grep -rqE '^import Mathlib' HexRealRoots conformance/HexRealRoots bench/HexRealRoots 2>/dev/null; then
            echo "ERROR: a source file imports Mathlib"; exit 1; fi
          echo "Mathlib-free OK"
