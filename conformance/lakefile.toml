name = "hexrealroots-conformance"
defaultTargets = ["HexRealRootsConformance", "hexrealroots_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRealRoots"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "58d88b17d0c817cd420317c51a7a01b95a9e4586"

[[lean_lib]]
name = "HexRealRootsConformance"
globs = ["HexRealRoots.Conformance"]

[[lean_exe]]
name = "hexrealroots_emit_fixtures"
root = "HexRealRoots.EmitFixtures"
